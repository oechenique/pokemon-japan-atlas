  - {name: column_name, type: VARCHAR, nullable: false}
  - {name: prefecture_code, type: VARCHAR, nullable: false}
  - {name: row_count, type: BIGINT, nullable: false}
  - {name: null_count, type: BIGINT, nullable: false}
  - {name: rate, type: DOUBLE, nullable: true, range: [0, 1]}
  - {name: license, type: VARCHAR, nullable: false}
