entity: shinkansen_edges
description: >-
  Tramos del grafo del Shinkansen (día 24) entre estaciones consecutivas del listado
  oficial, uno por par de estaciones. Geometría esquemática (recta); schematic marca
  los tramos mini (Akita, Yamagata), que no tienen vía del Shinkansen en el mapa.
sources: [shinkansen_line_station]
primary_key: [edge_id]
geometry:
  types: [LINESTRING]
  inside_japan: true
count: {min: 100}
columns:
  - {name: edge_id, type: VARCHAR, nullable: false}
  - {name: from_key, type: VARCHAR, nullable: false}
  - {name: to_key, type: VARCHAR, nullable: false}
  - {name: lines, type: 'VARCHAR[]', nullable: false}
  - {name: kind, type: VARCHAR, nullable: false, allowed: [full, mini]}
  - {name: schematic, type: BOOLEAN, nullable: false}
  - {name: distance_km, type: DOUBLE, nullable: false, range: [0, 200]}
  - {name: license, type: VARCHAR, nullable: false}
  - {name: geometry, type: GEOMETRY, nullable: false}
