entity: prefecture
description: Las 47 prefecturas de Japón, con nombres en ja/en/es y su región real.
sources: [natural_earth, wikidata]
primary_key: [prefecture_code]
geometry:
  types: [POLYGON, MULTIPOLYGON]
  inside_japan: true
count: {min: 47, max: 47}
columns:
  - {name: prefecture_code, type: VARCHAR, nullable: false, pattern: '^JP-\d{2}$'}
  - {name: name_ja, type: VARCHAR, nullable: false}
  - {name: name_en, type: VARCHAR, nullable: false}
  - {name: name_es, type: VARCHAR, nullable: true}
  - name: real_region
    type: VARCHAR
    nullable: false
    allowed: [Hokkaido, Tohoku, Kanto, Chubu, Kinki, Chugoku, Shikoku, Kyushu, Okinawa]
  # natural_earth, o wikidata cuando Natural Earth la deja vacía.
  - {name: real_region_source, type: VARCHAR, nullable: false, allowed: [natural_earth, wikidata]}
  - {name: wikidata, type: VARCHAR, nullable: false, pattern: '^Q\d+$'}
  - {name: area_km2, type: DOUBLE, nullable: false, range: [1, 100000]}
  - {name: license, type: VARCHAR, nullable: false}
  - {name: geometry, type: GEOMETRY, nullable: false}
null_report:
  columns: [name_es]
